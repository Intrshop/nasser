# إعدادات نظام ناصر
# Nasser System Configuration

[System]
# اسم النظام
name = Nasser Linux System
version = 1.0.0

# نوع النظام
type = linux
distro = ubuntu-based

# معرف النظام
system_id = nasser-1
hostname = nasser-system

[Language]
# اللغة الأساسية
default_language = ar_SA
# لغات إضافية
additional_languages = en_US, fr_FR

# دعم RTL (اليمين لليسار)
rtl_support = true

# دعم الكلام العربي
arabic_speech_support = true

[AI]
# تفعيل نظام AI
enabled = true

# نموذج AI الافتراضي
default_model = nasser-ai-v1

# مستوى الذكاء (1-10)
intelligence_level = 8

# تفعيل التعلم الآلي
machine_learning = true

# تحديث النماذج التلقائي
auto_update_models = true

[Security]
# مستوى الأمان
security_level = high

# تشفير كلمات المرور
password_encryption = true

# تشفير البيانات
data_encryption = true

# نوع التشفير
encryption_algorithm = AES-256

# جدار ناري
firewall_enabled = true

# SELinux
selinux_enabled = true

[Performance]
# تحسين الأداء تلقائي
auto_optimization = true

# حجم الذاكرة المخزنة مؤقتاً (MB)
cache_size = 512

# حد أقصى للعمليات
max_processes = 256

# انتظار المهام (ثانية)
task_timeout = 300

[UI]
# واجهة المستخدم
ui_theme = dark
ui_language = ar_SA

# دقة الشاشة
screen_resolution = 1920x1080

# حجم الخط
font_size = 12

# نمط الخط
font_family = Noto Sans Arabic

[Network]
# إعدادات الشبكة
ipv4_enabled = true
ipv6_enabled = true

# DNS
dns_primary = 8.8.8.8
dns_secondary = 8.8.4.4

# Proxy
proxy_enabled = false

[Logging]
# مستوى السجل
log_level = INFO

# حجم ملف السجل (MB)
log_file_size = 100

# عدد ملفات السجل المحفوظة
log_files_backup = 10

# مسار السجل
log_path = /opt/nasser/var/log

[Updates]
# التحديثات التلقائية
auto_updates = true

# مدة التحديث (ساعة)
update_interval = 24

# التحديثات الأمنية الفورية
security_updates_immediate = true

[Monitor]
# مراقبة النظام
monitoring_enabled = true

# فترة المراقبة (ثانية)
monitoring_interval = 60

# حفظ إحصائيات الأداء
save_stats = true

[Database]
# قاعدة البيانات الرئيسية
db_type = postgresql
db_host = localhost
db_port = 5432
db_name = nasser_db
db_user = nasser_user

# حجم مجموعة الاتصالات
connection_pool_size = 20

[Cache]
# نظام التخزين المؤقت
cache_backend = redis
cache_host = localhost
cache_port = 6379
cache_db = 0
cache_ttl = 3600
